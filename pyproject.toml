[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayonce"
version = "0.1.0"
description = "A token- and bandwidth-efficient communication protocol for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ömer Faruk Gürsel" },
    { name = "Fatih Emre Oğan" },
    { name = "Enes Ersoy" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
