[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayonce"
version = "0.1.0"
description = "A token- and bandwidth-efficient communication protocol for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ömer Faruk Gürsel" },
    { name = "Fatih Emre Oğan" },
    { name = "Enes Ersoy" },
]
dependencies = ["cbor2>=5.6", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "zstandard>=0.22", "tiktoken>=0.7", "matplotlib>=3.8"]
bench = ["zstandard>=0.22", "tiktoken>=0.7", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sayonce = ["bench/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
