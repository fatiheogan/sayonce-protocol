name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test the benchmark tools
        run: |
          python examples/demo.py --rounds 3 --context-kb 5
          python -m sayonce.bench.harness --systems jsonrpc sayonce --context-kb 2 --rounds 3 --out /tmp/ci/sweep.csv
          python -m sayonce.bench.faults --faults none corrupt_msg --context-kb 2 --rounds 4 --fault-every 2 --out /tmp/ci/faults.csv
          python -m sayonce.bench.analyze /tmp/ci/sweep.csv --faults-csv /tmp/ci/faults.csv --out /tmp/ci/analysis
